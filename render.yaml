services:
  - type: web
    name: xauusd-signal-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: SYMBOL
        value: XAU/USD
      - key: POLL_SECONDS
        value: 300
      - key: OUTPUTSIZE
        value: 120
      - key: ACCOUNT_SIZE
        value: 50000
      - key: DAILY_TARGET_MIN
        value: 250
      - key: DAILY_TARGET_MAX
        value: 350
      - key: NORMAL_LOT
        value: 0.15
      - key: AGGRESSIVE_LOT
        value: 0.25
      - key: MAX_LOT
        value: 0.30
      - key: MAX_RISK_PER_TRADE
        value: 120
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SIGNAL_COOLDOWN_MINUTES
        value: 20
      - key: SEND_WAIT_SIGNALS
        value: false
      - key: SEND_STARTUP_MESSAGE
        value: true
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
